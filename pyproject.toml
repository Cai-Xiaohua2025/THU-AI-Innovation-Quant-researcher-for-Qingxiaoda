[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thu-ai-innovation-quant-researcher"
version = "0.3.0"
description = "Qingxiaoda-compatible compliant financial research agent for THU AI Innovation Competition"
readme = "README_EN.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.3",
    "flask-cors>=6.0.0",
    "gunicorn>=23.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.8.0",
    "pypdf>=4.0.0",
    "pandas>=1.5.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
fundamentals = ["akshare>=1.12.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qingyan_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
omit = ["src/qingyan_agent/*orig", "src/qingyan_agent/*rej"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["*.orig", "*.rej", "outputs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
